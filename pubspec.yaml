name: city_navigation
description: "MapNote - Приложение для заметок на карте с использованием Yandex MapKit"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  yandex_mapkit: ^4.2.1
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  provider: ^6.1.1
  image_picker: ^1.0.7
  share_plus: ^7.2.1


dev_dependencies:
  build_runner: ^2.4.6

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1 


flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_tl.png"
  
  adaptive_icon_background: "#2196F3"  
  adaptive_icon_foreground: "assets/icon/app_icon_tl.png"
  
  min_sdk_android: 21
  
  remove_alpha_ios: true
  
  web:
    generate: true
    image_path: "assets/icon/app_icon_tl.png"
    background_color: "#2196F3"
    theme_color: "#2196F3"